name: Poll OpenSky for Berlin flights

on:
  schedule:
    - cron: "3-59/5 * * * *"   # every 5 min, offset from :00 — GitHub's docs warn round-number times (e.g. :00, :05) see the most scheduler load/delay, and recommend offsetting. "* * * * *" (every 1 min) never fired at all in 25+ min of testing; a plain "*/5" also saw zero scheduled runs across 4 expected windows (21 min) despite the workflow showing "active" with correct permissions — this offset is GitHub's own documented fix for that. 288 calls/day, comfortably under OpenSky's 400/day free quota.
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and transform OpenSky data
        run: python3 scripts/fetch_flights.py

      - name: Commit updated data (only if it changed)
        run: |
          git config user.name "berlin-skywatch-bot"
          git config user.email "actions@github.com"
          git add data/latest.json data/route_cache.json
          git diff --quiet --cached || git commit -m "Update flight data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Retry on push rejection (e.g. a manual push landing at the same moment)
          # instead of silently dropping this cycle's update.
          for i in 1 2 3; do
            git push && break
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
