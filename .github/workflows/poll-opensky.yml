name: Poll OpenSky for Berlin flights

on:
  schedule:
    - cron: "3-59/5 * * * *"   # every 5 min, offset from :00 — GitHub's docs warn round-number times (e.g. :00, :05) see the most scheduler load/delay, and recommend offsetting. "* * * * *" (every 1 min) never fired at all in 25+ min of testing; a plain "*/5" also saw zero scheduled runs across 4 expected windows (21 min) despite the workflow showing "active" with correct permissions — this offset is GitHub's own documented fix for that. 288 calls/day, comfortably under OpenSky's 400/day free quota.
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and transform OpenSky data
        run: python3 scripts/fetch_flights.py

      - name: Commit updated data (only if it changed)
        run: |
          git config user.name "berlin-skywatch-bot"
          git config user.email "actions@github.com"
          # These are just regenerated snapshot files (no meaningful history to
          # reconcile), so on a push race we re-commit our freshly computed content
          # on top of whatever the remote tip now is, rather than rebase/merge —
          # rebasing hit the exact same data-file conflict on every retry and just
          # failed the job outright.
          for i in 1 2 3 4 5; do
            git add data/latest.json data/route_cache.json data/ground_watch.json data/aircraft_cache.json
            if git diff --quiet --cached; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Update flight data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i), retrying against latest remote..."
            git fetch origin main
            git reset --soft origin/main
            sleep 2
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1
